<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Scan Mode - StockSense</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            plum: {
              DEFAULT: '#54384d',
              dark: '#3d2737',
              light: '#6c4964',
            },
            teal: {
              DEFAULT: '#17A2B8',
              hover: '#138496',
              light: '#e8f7fa'
            },
            amber: {
              DEFAULT: '#F59E0B',
              warm: '#D97706'
            }
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
<style>
    body {
      width: 390px;
      height: 844px;
      margin: 0 auto;
      overflow: hidden;
      background-color: #0b0f14;
      font-family: 'Manrope', sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Plum Gradient specified in design system */
    .bg-plum-gradient {
      background: linear-gradient(135deg, #54384d 0%, #3a2434 100%);
    }

    /* Scan Laser Animation */
    @keyframes scanMove {
      0% {
        top: 6px;
        opacity: 0.9;
      }
      50% {
        top: calc(100% - 8px);
        opacity: 1;
      }
      100% {
        top: 6px;
        opacity: 0.9;
      }
    }

    .scan-laser {
      animation: scanMove 2.6s ease-in-out infinite;
      box-shadow: 0 0 12px 2px rgba(23, 162, 184, 0.75), 0 0 4px #17A2B8;
    }

    /* HUD Corner Brackets */
    .corner-tl {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 22px;
      height: 22px;
      border-top: 3.5px solid #17A2B8;
      border-left: 3.5px solid #17A2B8;
      border-top-left-radius: 4px;
    }
    .corner-tr {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 22px;
      height: 22px;
      border-top: 3.5px solid #17A2B8;
      border-right: 3.5px solid #17A2B8;
      border-top-right-radius: 4px;
    }
    .corner-bl {
      position: absolute;
      bottom: -2px;
      left: -2px;
      width: 22px;
      height: 22px;
      border-bottom: 3.5px solid #17A2B8;
      border-left: 3.5px solid #17A2B8;
      border-bottom-left-radius: 4px;
    }
    .corner-br {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 22px;
      height: 22px;
      border-bottom: 3.5px solid #17A2B8;
      border-right: 3.5px solid #17A2B8;
      border-bottom-right-radius: 4px;
    }

    /* Target Reticle subtle grid */
    .reticle-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      pointer-events: none;
    }
    .reticle-center::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(23, 162, 184, 0.45);
    }
    .reticle-center::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(23, 162, 184, 0.45);
    }

    /* Bottom Sheet Elevation */
    .sheet-shadow {
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35), 0 -2px 6px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>
<body class="flex flex-col h-[844px] w-[390px] bg-neutral-950 text-neutral-800">
<!-- TOP APP BAR (56px) with Plum Gradient -->
<header class="h-[56px] min-h-[56px] bg-[#1a2744] px-4 flex items-center justify-between z-30 shadow-md">
<div class="flex items-center space-x-3.5">
<button aria-label="Go back" class="w-9 h-9 flex items-center justify-center rounded-lg text-white/90 hover:bg-white/10 active:scale-95 transition-all">
<i class="fa-solid fa-arrow-left text-base"></i>
</button>
<div class="flex items-baseline space-x-1.5">
<h1 class="text-white font-semibold text-[17px] tracking-tight">Scan</h1>
<span class="text-white/60 text-xs font-mono font-medium">· WH1</span>
</div>
</div>
<!-- Right Controls: Status indicator & Flashlight toggle -->
<div class="flex items-center space-x-2">
<div class="flex items-center px-2 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-[10px] text-emerald-300 font-mono">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
        LIVE
      </div>
<button aria-label="Toggle Flashlight" class="w-9 h-9 flex items-center justify-center rounded-lg bg-white/15 text-amber-300 hover:bg-white/25 active:scale-95 transition-all shadow-inner" title="Flashlight On">
<i class="fa-solid fa-bolt text-sm"></i>
</button>
</div>
</header>
<!-- CAMERA VIEWFINDER (Main Area) -->
<main class="relative flex-1 bg-black overflow-hidden flex flex-col items-center justify-start pt-6">
<!-- Warehouse Shelf Real Viewfinder Image -->
<div class="absolute inset-0 z-0">
<img alt="Warehouse camera viewfinder background" class="w-full h-full object-cover opacity-85 scale-105 filter contrast-110" src="https://lh3.googleusercontent.com/aida/AEtjO1UgwIIQIIed_0Mq8ulZK9OaLWUlkdp-5Dc_yyjFWhOVypEyQKcf61iBl_SNVBXsyge1cO4XcdCkZMnJN3Tpj2PIMae7VJ3LLyltaOOXhPik6irVYwGLZx6vyCeALTX2VcpVRuQmx39o63Zteab1wJLDC8v22zXP5sCjAXhScJF87vRqg62zQsiannLUcWz1x3Ig82Yu-CV1o3vhvjQC7R4NTuQsinwkeJx2pvV8F5z7MXrRZ3ZxmHlQWRI">
<!-- Vignette and dark overlays for industrial AR contrast -->
<div class="absolute inset-0 bg-gradient-to-b from-black/45 via-black/20 to-black/85"></div>
<!-- AR Viewfinder telemetry guidelines -->
<div class="absolute inset-0 pointer-events-none opacity-25">
<div class="absolute left-6 right-6 top-1/3 border-b border-white/20 border-dashed"></div>
<div class="absolute top-4 bottom-28 left-1/2 border-r border-white/15 border-dashed"></div>
</div>
</div>
<!-- SCANNER TARGET AREA -->
<div class="relative z-10 flex flex-col items-center">
<!-- Teal Square Scan Frame (195px × 195px) -->
<div class="relative w-[196px] h-[196px] rounded-sm bg-teal-500/5 backdrop-blur-[0.5px]">
<!-- 4 Corner Brackets -->
<span class="corner-tl"></span>
<span class="corner-tr"></span>
<span class="corner-bl"></span>
<span class="corner-br"></span>
<!-- Center Crosshair Reticle -->
<div class="reticle-center"></div>
<!-- Scanning Horizontal Teal Line -->
<div class="absolute left-1 right-1 h-[2px] bg-teal scan-laser"></div>
<!-- Detected QR Ghost Bounding Box inside reticle -->
<div class="absolute inset-5 border border-teal/40 rounded bg-teal/10 flex items-center justify-center pointer-events-none">
<i class="fa-solid fa-qrcode text-teal/40 text-4xl"></i>
</div>
</div>
<!-- Muted Helper Text with backdrop pill -->
<div class="mt-3 px-3 py-1 rounded-full bg-black/60 backdrop-blur-md border border-white/10 flex items-center space-x-1.5 shadow-sm">
<i class="fa-solid fa-crosshairs text-teal text-xs"></i>
<p class="text-neutral-300 text-xs font-medium tracking-wide">Point at a product QR label</p>
</div>
</div>
<!-- BOTTOM SHEET: Result of Successful Scan -->
<div class="mt-auto w-full z-20 bg-white rounded-t-[16px] sheet-shadow px-5 pt-2.5 pb-6 flex flex-col border-t border-neutral-100">
<!-- Grab Handle -->
<div class="w-10 h-1 bg-neutral-300 rounded-full mx-auto mb-3.5"></div>
<!-- Header: Product Name + SKU + Scan Success Tag -->
<div class="flex items-start justify-between">
<div>
<div class="flex items-center space-x-2">
<h2 class="text-[20px] font-medium text-neutral-900 tracking-tight leading-snug">Office Chair Ergo</h2>
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
<i class="fa-solid fa-circle-check text-[10px] mr-1 text-emerald-600"></i> Matched
            </span>
</div>
<p class="font-mono text-xs text-neutral-500 font-medium mt-0.5 tracking-wider">SKU: FUR-CHR-001</p>
</div>
<button class="text-neutral-400 hover:text-neutral-600 p-1.5 -mr-1.5 rounded-lg active:bg-neutral-100 transition-colors" title="View product history">
<i class="fa-solid fa-ellipsis-vertical text-sm"></i>
</button>
</div>
<!-- On-Hand Total Stock Display -->
<div class="mt-3.5 mb-3 bg-neutral-50 rounded-xl p-3 border border-neutral-200/80 flex items-baseline justify-between">
<span class="text-xs font-semibold text-neutral-500 uppercase tracking-wider">Total On Hand</span>
<div class="flex items-baseline space-x-1"><span class="font-mono text-[34px] font-bold text-[#3366cc] leading-none">46</span><span class="font-mono text-sm font-semibold text-[#3366cc]/70">pcs</span></div>
</div>
<!-- Stock Locations Breakdown (Two Rows) -->
<div class="space-y-1.5 mb-4 text-xs">
<!-- Row 1: Primary Warehouse Location -->
<div class="flex items-center justify-between py-1.5 px-3 rounded-lg bg-white border border-neutral-200 hover:bg-neutral-50 transition-colors">
<div class="flex items-center space-x-2">
<span class="w-2 h-2 rounded-full bg-[#3366cc]"></span>
<span class="font-medium text-neutral-800">WH1/Stock/Rack B</span>
<span class="px-1.5 py-0.2 rounded bg-neutral-100 text-[10px] font-mono text-neutral-600 border border-neutral-200">Current</span>
</div>
<span class="font-mono font-semibold text-neutral-900">40 pcs</span>
</div>
<!-- Row 2: Secondary Warehouse Location -->
<div class="flex items-center justify-between py-1.5 px-3 rounded-lg bg-white border border-neutral-200 hover:bg-neutral-50 transition-colors">
<div class="flex items-center space-x-2">
<span class="w-2 h-2 rounded-full bg-neutral-400"></span>
<span class="font-medium text-neutral-600">WH2/Stock</span>
</div>
<span class="font-mono font-semibold text-neutral-600">6 pcs</span>
</div>
</div>
<!-- 2x2 ACTION BUTTON GRID (56px each) -->
<div class="grid grid-cols-2 gap-2.5">
<!-- Button 1: Receive (Solid Plum) -->
<button class="h-[56px] rounded-xl bg-[#3366cc] hover:bg-[#2557be] active:scale-[0.98] text-white font-semibold text-sm flex items-center justify-center space-x-2 shadow-sm transition-all">
<div class="w-7 h-7 rounded-lg bg-white/15 flex items-center justify-center">
<i class="fa-solid fa-arrow-down-to-bracket text-xs"></i>
</div>
<span>Receive</span>
</button>
<!-- Button 2: Deliver (Solid Teal) -->
<button class="h-[56px] rounded-xl bg-teal hover:bg-teal-hover active:scale-[0.98] text-white font-semibold text-sm flex items-center justify-center space-x-2 shadow-sm transition-all">
<div class="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center">
<i class="fa-solid fa-truck-ramp-box text-xs"></i>
</div>
<span>Deliver</span>
</button>
<!-- Button 3: Move (Orange Outline) -->
<button class="h-[56px] rounded-xl bg-white border-2 border-amber active:scale-[0.98] text-amber-warm font-semibold text-sm flex items-center justify-center space-x-2 hover:bg-amber-50/50 transition-all">
<div class="w-7 h-7 rounded-lg bg-amber-500/10 flex items-center justify-center text-amber-warm">
<i class="fa-solid fa-arrows-up-down-left-right text-xs"></i>
</div>
<span>Move</span>
</button>
<!-- Button 4: Count (Grey Outline) -->
<button class="h-[56px] rounded-xl bg-white border border-neutral-300 active:scale-[0.98] text-neutral-700 font-semibold text-sm flex items-center justify-center space-x-2 hover:bg-neutral-50 transition-all">
<div class="w-7 h-7 rounded-lg bg-neutral-100 flex items-center justify-center text-neutral-600">
<i class="fa-solid fa-clipboard-check text-xs"></i>
</div>
<span>Count</span>
</button>
</div>
</div>
</main>


</body></html>
